# 宿主机 Nginx 反向代理配置（与 Caddy 二选一）
#
# 适用：机器上还跑着别的站点或服务，不想让容器接管 80/443。
# 此时 app 只监听 127.0.0.1:3000，由本配置对外提供服务。
#
# 安装：
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/kiasite.conf
#   sudo ln -sf /etc/nginx/sites-available/kiasite.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 证书：可以用 certbot 签发（sudo certbot --nginx -d example.com -d www.example.com），
#       也可以沿用云厂商签发的证书，把下面两个 ssl_ 指令改成实际路径即可。

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 后端地址：端口要与 .env 的 APP_PORT 一致（默认 3000）
upstream kiasite_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_session_timeout 5m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    # 后台上传大图，Nginx 默认 1m 会直接 413
    client_max_body_size 64m;
    client_body_timeout 120s;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 带 hash 的构建产物，长缓存
    location /_next/static/ {
        proxy_pass http://kiasite_app;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Payload 生成的图片尺寸，文件名唯一，可放心缓存
    location /api/media/file/ {
        proxy_pass http://kiasite_app;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://kiasite_app;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 120s;
        # 后台实时预览走 SSE，必须关掉缓冲
        proxy_buffering off;
    }
}
